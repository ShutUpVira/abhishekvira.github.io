<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="stTorchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#14110f"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="torchBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <filter id="torchGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="4" y="4" width="100" height="100" rx="22" fill="url(#stTorchBg)" stroke="#382f25" stroke-width="1.5"/>

  <!-- Radiant Light Beam Cone -->
  <polygon points="54,34 26,10 82,10" fill="url(#beamGrad)" filter="url(#torchGlow)" opacity="0.9"/>
  <!-- Secondary soft wide beam -->
  <polygon points="54,34 16,8 92,8" fill="url(#beamGrad)" opacity="0.35"/>

  <!-- Shake Motion Arcs (Motorola double-shake gesture) -->
  <!-- Left Shake Waves -->
  <path d="M26 44 Q20 54 26 64" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.85" filter="url(#torchGlow)"/>
  <path d="M19 40 Q11 54 19 68" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  <!-- Right Shake Waves -->
  <path d="M82 44 Q88 54 82 64" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.85" filter="url(#torchGlow)"/>
  <path d="M89 40 Q97 54 89 68" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>

  <!-- Flashlight Bezel & Head -->
  <path d="M42 38 L66 38 L62 48 L46 48 Z" fill="#52525b" stroke="#a1a1aa" stroke-width="1"/>
  <!-- Glowing Lens Rim -->
  <ellipse cx="54" cy="38" rx="12" ry="4" fill="#fef08a" filter="url(#torchGlow)"/>
  <ellipse cx="54" cy="38" rx="8" ry="2.5" fill="#ffffff"/>

  <!-- Flashlight Barrel / Handle -->
  <rect x="47" y="48" width="14" height="28" rx="2" fill="url(#torchBody)" stroke="#27272a" stroke-width="1"/>
  <!-- Grip Ridges -->
  <line x1="48" y1="54" x2="60" y2="54" stroke="#18181b" stroke-width="1.5"/>
  <line x1="48" y1="59" x2="60" y2="59" stroke="#18181b" stroke-width="1.5"/>
  <line x1="48" y1="64" x2="60" y2="64" stroke="#18181b" stroke-width="1.5"/>
  <line x1="48" y1="69" x2="60" y2="69" stroke="#18181b" stroke-width="1.5"/>

  <!-- Tailcap -->
  <rect x="46" y="76" width="16" height="5" rx="1.5" fill="#3f3f46" stroke="#18181b" stroke-width="1"/>

  <!-- Power Indicator LED Dot on handle -->
  <circle cx="54" cy="51" r="1.5" fill="#22c55e" filter="url(#torchGlow)"/>

  <!-- Shake Gesture Mini Badge (Bottom) -->
  <rect x="22" y="88" width="64" height="12" rx="6" fill="#181411" stroke="#f59e0b" stroke-width="1"/>
  <text x="54" y="96.5" font-family="monospace" font-size="6.5" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="0.5">SHAKE TORCH</text>
</svg>

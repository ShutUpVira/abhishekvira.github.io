<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="flBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182230"/>
      <stop offset="50%" stop-color="#0e1724"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="flGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="flGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="4" y="4" width="100" height="100" rx="22" fill="url(#flBg)" stroke="#223247" stroke-width="1.5"/>
  
  <!-- Outer Subtle Radar Grid Ring -->
  <circle cx="54" cy="54" r="32" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Crosshair Reticle Lines (Matching APK vector geometry) -->
  <line x1="54" y1="20" x2="54" y2="30" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#flGlow)"/>
  <line x1="54" y1="78" x2="54" y2="88" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#flGlow)"/>
  <line x1="20" y1="54" x2="30" y2="54" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#flGlow)"/>
  <line x1="78" y1="54" x2="88" y2="54" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#flGlow)"/>

  <!-- Outer Focus Ring -->
  <circle cx="54" cy="54" r="20" fill="none" stroke="url(#flGlowGrad)" stroke-width="2.5" filter="url(#flGlow)"/>

  <!-- Corner Brackets (HUD Focus Viewfinder) -->
  <path d="M38 42 L36 42 A2 2 0 0 1 34 40 L34 38" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M70 42 L72 42 A2 2 0 0 0 74 40 L74 38" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M38 66 L36 66 A2 2 0 0 0 34 68 L34 70" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M70 66 L72 66 A2 2 0 0 1 74 68 L74 70" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Inner Active Target Ring -->
  <circle cx="54" cy="54" r="9" fill="none" stroke="#f59e0b" stroke-width="1.8"/>

  <!-- Center Bullseye Focus Dot -->
  <circle cx="54" cy="54" r="3.5" fill="#f59e0b" filter="url(#flGlow)"/>
  <circle cx="54" cy="54" r="1.5" fill="#fff"/>

  <!-- Productivity Mini Badge (Bottom) -->
  <rect x="22" y="88" width="64" height="12" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="54" y="96.5" font-family="monospace" font-size="6.5" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">FOCUS MAX</text>
</svg>

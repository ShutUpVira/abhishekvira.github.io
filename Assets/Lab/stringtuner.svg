<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="50%" stop-color="#13171d"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <filter id="stGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="4" y="4" width="100" height="100" rx="22" fill="url(#stBg)" stroke="#2a323d" stroke-width="1.5"/>
  <!-- Dial Arc (Meter from StringTuner APK) -->
  <path d="M24 64 A32 32 0 0 1 84 64" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <!-- In-tune center target arc -->
  <path d="M46 32.5 A32 32 0 0 1 62 32.5" fill="none" stroke="#22c55e" stroke-width="4" filter="url(#stGlow)"/>
  <!-- Center In-Tune Tick Mark -->
  <line x1="54" y1="22" x2="54" y2="32" stroke="#22c55e" stroke-width="3" stroke-linecap="round" filter="url(#stGlow)"/>
  <!-- Left/Right Ticks -->
  <line x1="34" y1="44" x2="40" y2="48" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="74" y1="44" x2="68" y2="48" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <!-- Tuner Needle -->
  <line x1="54" y1="80" x2="54" y2="32" stroke="#f8c830" stroke-width="3" stroke-linecap="round" filter="url(#stGlow)"/>
  <!-- Pivot Base -->
  <circle cx="54" cy="80" r="7" fill="#f8c830"/>
  <circle cx="54" cy="80" r="3" fill="#13171d"/>
  <!-- ZERO LATENCY / NO ADS Badge -->
  <rect x="20" y="88" width="68" height="12" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="54" y="96.5" font-family="monospace" font-size="6.5" font-weight="bold" fill="#22c55e" text-anchor="middle" letter-spacing="0.5">ZERO LATENCY</text>
</svg>
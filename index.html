<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Abhishek Vira — A Little World</title>
  <meta name="description" content="An interactive 8-bit personal world for Abhishek Vira — musician, builder, runner & strategist.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2313382c'/><text x='3' y='12' font-family='monospace' font-size='10' font-weight='bold' fill='%23f5f2eb'>AV</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-cream: #f6f3eb;
      --dot-color: #d6cebe;
      --frame-bg: #13382c;
      --frame-border: #0b221a;
      --hud-text: #b9d8ca;
      --ink: #13382c;
      --body-text: #2c3e35;
      --muted: #6b7d74;
      --card-bg: #fffdfa;
      --card-border: #13382c;
      --gold: #f59e0b;
      --px: 'Press Start 2P', monospace;
      --mono: 'Space Mono', monospace;
      --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: var(--bg-cream);
      background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      color: var(--body-text);
      font: 15px/1.6 var(--sans);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    :focus-visible {
      outline: 3px solid var(--gold) !important;
      outline-offset: 2px !important;
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* Outer Wrapper */
    #app-container {
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(10px, 2.5vw, 20px) clamp(10px, 2.5vw, 18px) 40px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    /* Top Page Header (Matching ChatGPT build) */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 6px;
      gap: 10px;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      flex-shrink: 0;
    }
    .brand-badge {
      width: 44px;
      height: 44px;
      background: var(--frame-bg);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 14px var(--mono);
      font-weight: 700;
      border: 2px solid var(--frame-border);
      border-radius: 2px;
      letter-spacing: 0.5px;
    }
    .brand-titles h1 {
      margin: 0;
      font: clamp(11px, 2.5vw, 13px) var(--px);
      color: var(--ink);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .brand-titles span {
      font: 10px var(--mono);
      color: var(--muted);
      letter-spacing: 1px;
      display: block;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.5vw, 14px);
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font: 11px var(--mono);
      color: var(--muted);
      background: rgba(19, 56, 44, 0.05);
      border: 1px solid rgba(19, 56, 44, 0.12);
      padding: 6px 12px;
      border-radius: 20px;
      white-space: nowrap;
    }
    @media (max-width: 640px) {
      .status-pill { display: none; }
      .brand-badge { width: 38px; height: 38px; font-size: 12px; }
      .brand-group { gap: 8px; }
      .header-btn { padding: 6px 10px; font-size: 10px; }
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
      70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .header-btn {
      font: 11px var(--mono);
      background: #fff;
      color: var(--ink);
      border: 1.5px solid var(--ink);
      padding: 7px 12px;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 2px 2px 0 var(--ink);
      transition: all 0.15s;
      white-space: nowrap;
    }
    .header-btn:hover {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--ink);
      background: #faf7f0;
    }

    /* ==========================================================================
       WORLD MAP FRAME (Deep Forest Bezel + GBA Pokémon Ruby World Inside)
       ========================================================================== */
    #world-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .bezel-frame {
      background: var(--frame-bg);
      border: 4px solid var(--frame-border);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(11, 34, 26, 0.25);
      position: relative;
    }
    .bezel-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: #0f2d23;
      border-bottom: 2px solid #091a14;
      font: 10px var(--mono);
      color: var(--hud-text);
      letter-spacing: 1px;
    }
    .bezel-top-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bezel-top-left strong { color: #fff; }
    .bezel-top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 3:2 Stage Frame */
    #stage {
      position: relative;
      width: 100%;
      aspect-ratio: 3/2;
      background: #58b848;
      overflow: hidden;
    }
    #cv {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      touch-action: none;
      cursor: crosshair;
    }

    /* In-world GBA Pokémon Dialogue Box */
    #dialog {
      position: absolute;
      left: 3%;
      right: 3%;
      bottom: 4%;
      display: none;
      min-height: 24%;
      padding: 3% 4%;
      background: #f8f8f8;
      border: 4px solid #202020;
      box-shadow: inset 0 0 0 3px #f8f8f8, inset 0 0 0 6px #4880c0;
      font: clamp(8px, 1.6vw, 13px)/1.8 var(--px);
      color: #303030;
      cursor: pointer;
      z-index: 25;
    }
    #more {
      position: absolute;
      right: 14px;
      bottom: 8px;
      color: #e04040;
      animation: bl 0.6s steps(2) infinite;
    }
    #prompt, #hint {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      font: clamp(8px, 1.5vw, 11px) var(--px);
      border: 3px solid #000;
      padding: 8px 14px;
      white-space: nowrap;
      z-index: 20;
    }
    #prompt {
      top: 3%;
      background: var(--gold);
      color: #000;
      cursor: pointer;
      box-shadow: 3px 3px 0 #000;
      animation: promptPulse 1.2s infinite alternate;
    }
    #hint {
      bottom: 4%;
      background: #fff;
      color: #222;
      max-width: 92%;
      white-space: normal;
      text-align: center;
      line-height: 1.6;
    }
    @keyframes bl { 50% { opacity: 0; } }
    @keyframes promptPulse {
      0% { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1.04); }
    }

    /* Bezel Bottom Bar */
    .bezel-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #0f2d23;
      border-top: 2px solid #091a14;
      font: 10px var(--mono);
      color: var(--hud-text);
      gap: 8px;
    }
    .controls-badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .kb-badge {
      background: #174235;
      color: #fff;
      border: 1px solid #235e4b;
      padding: 2px 6px;
      border-radius: 2px;
      font: 9px var(--mono);
    }
    .mobile-hint { display: none; }
    @media (max-width: 680px), (hover: none) and (pointer: coarse) {
      .desktop-hint { display: none; }
      .mobile-hint { display: flex; }
    }

    /* Dedicated Mobile D-Pad (Shown on touch / mobile below the frame) */
    #pad {
      display: none;
      width: 100%;
      max-width: 440px;
      margin: 10px auto 0;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body.touch #pad { display: flex; }
    @media (max-width: 900px), (hover: none) and (pointer: coarse) {
      #pad { display: flex !important; }
    }

    .dp {
      display: grid;
      grid-template: repeat(3, clamp(44px, 12vw, 56px)) / repeat(3, clamp(44px, 12vw, 56px));
      gap: 3px;
    }
    .dp button {
      background: #1b4537;
      color: #fff;
      border: 2px solid var(--frame-border);
      font: clamp(14px, 4vw, 18px) var(--px);
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0 #000;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      border-radius: 3px;
    }
    .dp button.on {
      background: var(--gold) !important;
      color: #000 !important;
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 #000;
    }
    [data-d=u] { grid-area: 1/2; }
    [data-d=l] { grid-area: 2/1; }
    [data-d=r] { grid-area: 2/3; }
    [data-d=d] { grid-area: 3/2; }
    .dp-hub { grid-area: 2/2; background: #13382c; border: 1px solid #0b221a; }

    /* Action Buttons (A & B) */
    .action-group {
      display: flex;
      gap: clamp(8px, 2.5vw, 14px);
      align-items: center;
    }
    #ab, #bb {
      border: 3px solid #000;
      border-radius: 50%;
      font-family: var(--px);
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 3px 3px 0 #000;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #ab {
      width: clamp(58px, 16vw, 74px);
      height: clamp(58px, 16vw, 74px);
      background: #d83838;
      font-size: clamp(12px, 3.5vw, 15px);
    }
    #ab span { font: 8px var(--mono); opacity: 0.9; margin-top: 2px; }
    #ab.on {
      background: var(--gold) !important;
      color: #000 !important;
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #000;
    }

    #bb {
      width: clamp(48px, 13vw, 58px);
      height: clamp(48px, 13vw, 58px);
      background: #235e4b;
      font-size: clamp(10px, 3vw, 13px);
      margin-top: 14px;
    }
    #bb span { font: 7px var(--mono); opacity: 0.9; margin-top: 2px; }
    #bb.on {
      background: #38bdf8 !important;
      color: #000 !important;
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #000;
    }

    /* Bottom Navigation Dock Cards (Exact replica of Image 1) */
    .nav-dock-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: clamp(8px, 1.8vw, 12px);
      margin-top: 4px;
    }
    @media (max-width: 860px) {
      .nav-dock-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 500px) {
      .nav-dock-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    }

    .dock-card {
      background: #fdfcf7;
      border: 1.5px solid #dcd5c7;
      border-radius: 4px;
      padding: clamp(9px, 2vw, 12px) clamp(10px, 2vw, 14px);
      text-decoration: none;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .dock-card:hover {
      border-color: var(--ink);
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(19, 56, 44, 0.1);
      background: #fff;
    }
    .dock-icon {
      font-size: clamp(14px, 3vw, 17px);
      color: #1b4537;
    }
    .dock-label {
      font: 700 clamp(12px, 2.5vw, 13px) var(--sans);
      color: var(--ink);
    }

    /* ==========================================================================
       SUB-PAGES: The ChatGPT Frame & Card Design (Image 2)
       ========================================================================== */
    #pages { display: none; }
    #pages.active { display: block; }

    .inside-page-frame {
      background: var(--card-bg);
      border: 3.5px solid var(--frame-bg);
      border-radius: 4px;
      padding: clamp(20px, 4.5vw, 42px) clamp(16px, 4vw, 42px) clamp(28px, 5vw, 48px);
      box-shadow: 0 12px 36px rgba(19, 56, 44, 0.12);
      position: relative;
      margin-bottom: 24px;
      overflow: hidden;
    }
    @media (max-width: 640px) {
      .inside-page-frame { border-width: 2.5px; }
      .star-watermark { display: none; }
      .page-hero-title { font-size: clamp(26px, 8vw, 38px); margin-bottom: 12px; }
      .page-hero-subtitle { font-size: 15px; margin-bottom: 22px; }
      .dashed-sub-box { padding: 16px 14px; margin-bottom: 24px; }
      .content-grid { grid-template-columns: 1fr; }
      .dark-action-btn { width: 100%; text-align: center; }
    }

    /* Soft 4-Point Star Watermark in Top Right (Image 2) */
    .star-watermark {
      position: absolute;
      top: 30px;
      right: 40px;
      width: 140px;
      height: 140px;
      opacity: 0.18;
      pointer-events: none;
      fill: #a39577;
    }

    .breadcrumb-tag {
      font: 11px var(--mono);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #6a7e72;
      margin-bottom: 12px;
      display: block;
    }

    .page-hero-title {
      font: 800 clamp(32px, 5.5vw, 54px)/1.1 var(--sans);
      color: var(--ink);
      margin: 0 0 16px;
      letter-spacing: -1px;
    }

    .page-hero-subtitle {
      font: 17px/1.6 var(--sans);
      color: #3b5045;
      max-width: 680px;
      margin: 0 0 32px;
    }

    /* Dashed Construction / Feature Card (Image 2) */
    .dashed-sub-box {
      border: 2px dashed #b8cebf;
      border-radius: 4px;
      background: rgba(246, 243, 235, 0.5);
      padding: 24px 28px;
      margin-bottom: 32px;
    }
    .dashed-label {
      font: 10px var(--mono);
      letter-spacing: 1.5px;
      color: #6a7e72;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }
    .dashed-lead {
      font-size: 15px;
      line-height: 1.7;
      color: var(--body-text);
      margin: 0;
    }

    /* Section Headers */
    .section-sh {
      font: 11px var(--px);
      color: var(--ink);
      letter-spacing: 0.5px;
      margin: 36px 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e2ddd3;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Content Cards Grid */
    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }
    .content-card {
      background: #fff;
      border: 2px solid #d5cec0;
      border-radius: 4px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: all 0.15s;
    }
    .content-card:hover {
      border-color: var(--ink);
      box-shadow: 0 6px 16px rgba(19, 56, 44, 0.08);
      transform: translateY(-2px);
    }
    .content-card h3 {
      font: 700 17px var(--sans);
      color: var(--ink);
      margin: 0 0 6px;
    }
    .content-card p {
      font-size: 14px;
      line-height: 1.6;
      color: #4a5c52;
      margin: 6px 0 14px;
    }
    .content-meta {
      font: 11px var(--mono);
      color: #6a7e72;
      margin-bottom: 6px;
    }

    /* Chips & Tags */
    .tag-chip {
      display: inline-block;
      font: 10px var(--mono);
      background: #edf4ef;
      color: #174235;
      padding: 4px 8px;
      border-radius: 3px;
      margin: 3px 2px;
      border: 1px solid #d3e2d6;
    }

    /* Interactive Action Buttons */
    .dark-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--ink);
      color: #fff;
      font: 11px var(--mono);
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 12px 20px;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 3px 3px 0 var(--frame-border);
      transition: all 0.15s;
    }
    .dark-action-btn:hover {
      background: #1d4d3d;
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 var(--frame-border);
    }

    .light-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fdfcf7;
      color: var(--ink);
      font: 10px var(--mono);
      font-weight: 700;
      padding: 8px 14px;
      border: 1.5px solid var(--ink);
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 2px 2px 0 var(--ink);
      transition: all 0.15s;
    }
    .light-btn:hover {
      background: var(--ink);
      color: #fff;
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    /* Lists */
    .dashed-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .dashed-list li {
      padding: 14px 0;
      border-bottom: 1px dashed #c8dece;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .dashed-list li:last-child { border-bottom: none; }
    .list-title {
      font-weight: 700;
      color: var(--ink);
      font-size: 15px;
    }
    .list-sub {
      font-size: 13px;
      color: #55685d;
    }
    .list-date {
      font: 11px var(--mono);
      color: #d83838;
      font-weight: 700;
    }

    /* Retro Pixel Placeholder Box (Fallback when images are loading/offline) */
    .ph-box {
      width: 100%;
      height: 100%;
      background: conic-gradient(#e8d8a8 25%, #d8c898 0 50%, #e8d8a8 0 75%, #d8c898 0) 0 0/16px 16px;
      font: 10px var(--mono);
      color: #6a5a30;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      box-sizing: border-box;
      border: 1.5px solid #c4b58e;
    }

    /* Hero Cover Banner for Sub-Pages */
    .page-cover-banner {
      position: relative;
      width: 100%;
      aspect-ratio: 21/9;
      min-height: 170px;
      max-height: 310px;
      border: 2.5px solid var(--frame-bg);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 6px 20px rgba(19, 56, 44, 0.12);
      background: #0f2d23;
    }
    @media (max-width: 640px) {
      .page-cover-banner { aspect-ratio: 16/9; min-height: 150px; margin-bottom: 18px; }
    }

    /* Dedicated framing for Run Club group photo so Abhishek & all members are 100% visible */
    .page-cover-banner.run-cover {
      aspect-ratio: 16/11;
      max-height: 540px;
      min-height: 320px;
      background: #091a13;
    }
    .page-cover-banner.run-cover .page-cover-img {
      object-position: center 75%;
      transition: object-fit 0.2s ease;
    }
    @media (max-width: 640px) {
      .page-cover-banner.run-cover {
        aspect-ratio: 1/1;
        max-height: 420px;
        min-height: 280px;
      }
      .page-cover-banner.run-cover .page-cover-img {
        object-position: center 75%;
      }
    }
    .cover-expand-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      background: rgba(11, 34, 26, 0.9);
      backdrop-filter: blur(4px);
      color: #fff;
      border: 1px solid rgba(248, 200, 48, 0.5);
      font: 10px var(--mono);
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 2px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.15s;
      z-index: 5;
    }
    .cover-expand-btn:hover {
      background: var(--gold);
      color: #0b221a;
      border-color: #fff;
    }
    .page-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cover-overlay-badge {
      position: absolute;
      bottom: 12px;
      left: 14px;
      background: rgba(11, 34, 26, 0.88);

/* ==========================================================================
   SUB-PAGES: Framed inside the Image 2 Card Container
   ========================================================================== */
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');

// 4-Point Star SVG Watermark (Image 2)
const STAR_WATERMARK = `
  <svg class="star-watermark" viewBox="0 0 100 100">
    <path d="M50 0 C50 35, 65 50, 100 50 C65 50, 50 65, 50 100 C50 65, 35 50, 0 50 C35 50, 50 35, 50 0 Z"/>
  </svg>
`;

const renderInsideFrame = (breadcrumb, title, subtitle, contentHtml) => `
  <div class="inside-page-frame">
    ${STAR_WATERMARK}
    <span class="breadcrumb-tag">${breadcrumb}</span>
    <h2 class="page-hero-title">${title}</h2>
    <p class="page-hero-subtitle">${subtitle}</p>
    ${contentHtml}
    <div style="margin-top:40px;padding-top:20px;border-top:1.5px solid #dcd5c7">
      <a class="dark-action-btn" href="#/">← BACK TO THE WORLD</a>
    </div>
  </div>
`;

// Robust image renderer with graceful fallback to retro pixel pattern
const renderImg = (src, alt, cls = '', fallbackText = 'IMAGE') => {
  if (!src) {
    return `<div class="${cls} ph-box" role="img" aria-label="${esc(alt)}"><span>${esc(fallbackText)}</span></div>`;
  }
  return `<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';" /><div class="${cls} ph-box" style="display:none;" role="img" aria-label="${esc(alt)}"><span>${esc(fallbackText)}</span></div>`;
};

// Android APK Download Trigger
window.downloadApk = function(filename, url) {
  const a = document.createElement('a');
  a.href = url || '#';
  a.download = filename || 'app.apk';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};

// Cover Image Fit Toggle (Switch between cinematic framing & 100% full uncropped view)
window.toggleCoverFit = function(btn) {
  const banner = btn.closest('.page-cover-banner');
  if (!banner) return;
  const img = banner.querySelector('.page-cover-img');
  if (!img) return;
  if (img.style.objectFit === 'contain') {
    img.style.objectFit = '';
    img.style.background = '';
    btn.textContent = '🔍 FULL SQUAD';

  for (const k in pad) delete pad[k];
  
  const b = (buildingId && B.find(item => item.id === buildingId)) || lastB;
  if (b) {

    p.y = (b.y + b.h) * T + 14;

function sfx(k) {
  if (!snd || !AC) return;
  try {
    if (AC.state === 'suspended') AC.resume();
    const m = {
      talk: [660, 0.03, 'square'],
      step: [110, 0.03, 'triangle'],
      door: [880, 0.15, 'square'],
      ok: [990, 0.1, 'square']
    }[k];
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = m[2];
    o.frequency.value = m[0];
    g.gain.setValueAtTime(0.04, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + m[1]);
    o.connect(g);
    g.connect(AC.destination);
    o.start();
    o.stop(t + m[1]);
  } catch (e) {}
}

let currentAudio = null;
let currentPreviewBtn = null;
window.playAudioTrack = function(previewUrl, pattern, btn) {
  if (currentAudio) {
    try { currentAudio.pause(); } catch (_) {}
    const prevBtn = currentPreviewBtn;
    const same = (currentAudio.src === previewUrl);
    currentAudio = null;
    currentPreviewBtn = null;
    if (prevBtn) prevBtn.textContent = '▶ 30s PREVIEW';
    if (same && btn === prevBtn) return;
  }
  if (previewUrl) {
    try {
      const audio = new Audio(previewUrl);
      currentAudio = audio;
      currentPreviewBtn = btn;
      if (btn) btn.textContent = '⏸ PAUSE';
      audio.play().catch(e => {
        console.warn('Audio preview play blocked or offline, playing synth fallback:', e);
        if (btn) btn.textContent = '▶ 30s PREVIEW';
        currentAudio = null;
        currentPreviewBtn = null;
        playMelody(pattern);
      });
      audio.onended = () => {
        if (btn) btn.textContent = '▶ 30s PREVIEW';
        currentAudio = null;
        currentPreviewBtn = null;
      };
    } catch (e) {
      playMelody(pattern);
    }
  } else {
    playMelody(pattern);
  }
};

function playMelody(notes) {
  if (!snd) {
    snd = true;
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    $('#snd-toggle').innerHTML = '<span>🔊</span> SOUND: ON';
  }
  if (!notes || !notes.length || !AC) return;
  if (AC.state === 'suspended') AC.resume();
  notes.forEach((freq, i) => {
    setTimeout(() => {
      try {
        const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
        o.type = 'sawtooth';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.05, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        o.connect(g);
        g.connect(AC.destination);
        o.start(t);
        o.stop(t + 0.19);
      } catch (e) {}
    }, i * 140);
  });
}

function buildSprites() {

        for (let k = 0; k < 2; k++) {

            R(gg, px + (rnd(x, y, k + 3) * 13 | 0), py + (rnd(x, y, k + 7) * 12 | 0), 1, 2, '#48a038');

        if (t === 0 && rnd(x, y, 9) < 0.08) {
          const c = ['#f04848', '#f8d830', '#fff'][rnd(x, y, 4) * 3 | 0];
          R(gg, px + 7, py + 9, 1, 3, '#38802a');
          R(gg, px + 6, py + 8, 3, 1, c);

}

/* ==========================================================================
   INPUTS: Keyboard, Touch D-Pad, Mouse Click & Tap-to-Move
   ========================================================================== */
addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (route() !== 'world') {
      go('world');
      return;
    } else if (dopen) {
      closeDlg();
      return;
    }
  }
  if (route() !== 'world' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if ('arrowup arrowdown arrowleft arrowright w a s d'.split(' ').includes(k)) {
    keys[k] = 1; e.preventDefault();
  } else if ((k === 'enter' || k === ' ') && !e.target.closest('button,a,input,textarea')) {
    e.preventDefault(); if (!e.repeat) act();
  }
});
addEventListener('keyup', e => delete keys[e.key.toLowerCase()]);
addEventListener('blur', () => { for (const k in keys) delete keys[k]; for (const k in pad) delete pad[k]; });

// Mobile Touch D-Pad
$$('#pad [data-d]').forEach(b => {
  const d = b.dataset.d;
  const on = e => {
    e.preventDefault();
    pad[d] = 1;
    b.classList.add('on');
    if (b.setPointerCapture && e.pointerId) {
      try { b.setPointerCapture(e.pointerId); } catch (_) {}
    }
  };
  const off = e => {
    pad[d] = 0;
    b.classList.remove('on');
    if (b.hasPointerCapture && e.pointerId && b.hasPointerCapture(e.pointerId)) {
      try { b.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  };

  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(v => b.addEventListener(v, off));
  b.addEventListener('touchstart', on, { passive: false });
  ['touchend', 'touchcancel'].forEach(v => b.addEventListener(v, off, { passive: false }));
  b.oncontextmenu = e => e.preventDefault();
});

const onAct = e => {
  e.preventDefault();
  $('#ab').classList.add('on');
  act();
  setTimeout(() => $('#ab').classList.remove('on'), 150);
};
$('#ab').addEventListener('pointerdown', onAct);
$('#ab').addEventListener('touchstart', onAct, { passive: false });

const onB = e => {
  e.preventDefault();
  $('#bb').classList.add('on');
  const dock = document.querySelector('.nav-dock-grid');
  if (dock) dock.scrollIntoView({ behavior: 'smooth' });
  setTimeout(() => $('#bb').classList.remove('on'), 150);
};
$('#bb').addEventListener('pointerdown', onB);
$('#bb').addEventListener('touchstart', onB, { passive: false });

const wpos = e => {
  const r = cv.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width;
  const fy = (e.clientY - r.top) / r.height;
  return { fx, fy, x: cam.x + fx * VW, y: cam.y + fy * VH };
};

cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') mouse = wpos(e);
});
cv.addEventListener('pointerleave', () => mouse = null);

const handleTapOrClick = e => {
  if (busy || dopen) return;
  const w = wpos(e);
  const b = B.find(b => w.x >= b.x * T && w.x < (b.x + b.w) * T && w.y >= b.y * T && w.y < (b.y + b.h) * T);
  if (b) {
    if (nearB === b) return enter(b);
    auto = { x: b.x * T + b.dx + 6, y: (b.y + b.h) * T + 14, b, st: 0 };
  } else {
    auto = { x: w.x, y: w.y, st: 0 };
  }
};

cv.addEventListener('click', handleTapOrClick);
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || e.pointerType === 'pen') {
    handleTapOrClick(e);
  }
});

/* Step Loop */
function step(dt) {
  let kx = 0, ky = 0;
  const K = n => keys[n] || pad[n[0]];
  if (K('arrowleft') || keys.a || pad.l) kx--;
  if (K('arrowright') || keys.d || pad.r) kx++;
  if (K('arrowup') || keys.w || pad.u) ky--;
  if (K('arrowdown') || keys.s || pad.d) ky++;

  if ((kx || ky) && dopen && (ddone || dintro)) closeDlg();

  let vx = 0, vy = 0;
  if (busy || (dopen && !(kx || ky))) {}
  else if (kx || ky) {
    vx = kx; vy = ky; auto = null;
  } else {
    const t = auto || (mouse && { x: cam.x + mouse.fx * VW, y: cam.y + mouse.fy * VH });
    if (t) {
      const dx = t.x - p.x, dy = t.y - p.y, d = Math.hypot(dx, dy);
      if (d > (auto ? 3 : 6)) {
        vx = dx / d; vy = dy / d;
      } else if (auto && !auto.b) {
        auto = null;
      }
    }
  }

  if (vx && vy) {
    const n = Math.SQRT1_2; vx *= n; vy *= n;
  }

  const bx = p.x, by = p.y, s = SPD * dt;
  if (vx && !blocked(p.x + vx * s, p.y)) p.x += vx * s;
  if (vy && !blocked(p.x, p.y + vy * s)) p.y += vy * s;

  const mv = Math.hypot(p.x - bx, p.y - by);
  if (mv > 0) {
    p.dir = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? 'left' : 'right') : (vy < 0 ? 'up' : 'down');
    p.t += dt;
    const f = [0, 1, 0, 2][p.t / 0.13 & 3];
    if (f && f !== lastFr) sfx('step');
    lastFr = f;
    p.fr = f;
  } else {
    p.fr = 0; p.t = 0;
  }

  if (auto) {
    auto.st = (vx || vy) && mv < 0.15 * s ? auto.st + dt : 0;
    if (auto.b && nearB === auto.b) enter(auto.b);
    else if (auto.st > 0.6) {
      if (auto.b) enter(auto.b); else auto = null;
    }
  }
}

function draw(t) {
  // Clamped camera (Keeps all houses visible & properly centered)
  cam.x = Math.max(0, Math.min(MW * T - VW, Math.round(p.x - VW / 2)));
  cam.y = Math.max(0, Math.min(MH * T - VH, Math.round(p.y - VH / 2)));
  const cx = cam.x, cy = cam.y;

  // 1. Ground & Paths
  ctx.drawImage(GC, -cx, -cy);
  const f = reduced ? 0 : (t / 500 | 0) & 1;
  for (let y = cy >> 4; y <= ((cy + VH) >> 4) && y < MH; y++) {
    for (let x = cx >> 4; x <= ((cx + VW) >> 4) && x < MW; x++) {
      if (tl[y][x] === 2) {
        const px = x * T - cx, py = y * T - cy;
        R(ctx, px + (f ? 2 : 8), py + 4, 4, 1, '#88c8f8');
        R(ctx, px + (f ? 10 : 3), py + 11, 4, 1, '#88c8f8');
      }
    }
  }

  // 2. Y-sorted Renderables
  const it = [];

  // Trees
  trees.forEach(tr => {
    const y = (tr.y + 1) * T;
    if (y > cy && y - T - 8 < cy + VH && tr.x * T > cx - T && tr.x * T < cx + VW) {
      it.push({ y, f: () => ctx.drawImage(TS, tr.x * T - cx, tr.y * T - 8 - cy) });
    }
  });

  // Buildings (With roof ridge highlights, signs & proximity glow)
  B.forEach(b => it.push({
    y: (b.y + b.h) * T,
    f: () => {
      const x = b.x * T - cx, y = b.y * T - cy;
      ctx.drawImage(b.s, x, y);
      if (b.open) {
        R(ctx, b.dxp - cx, b.dyp - cy, 12, 16, '#1a0e08');
        R(ctx, b.dxp - cx + 2, b.dyp - cy + 2, 8, 14, '#3a2410');
      }
      if (b === nearB && !b.open) {
        const c = !reduced && ((t / 250 | 0) & 1) ? '#fff' : '#f8d030';
        R(ctx, x - 2, y - 2, b.w * T + 4, 2, c);
        R(ctx, x - 2, y + b.h * T, b.w * T + 4, 2, c);
        R(ctx, x - 2, y, 2, b.h * T, c);
        R(ctx, x + b.w * T, y, 2, b.h * T, c);
      }
    }
  }));

  // Objects & NPCs
  OB.forEach(o => it.push({
    y: (o.ty + 1) * T,
    f: () => {
      const x = o.tx * T - cx, y = o.ty * T - cy;
      if (o.type === 'cave') ctx.drawImage(CS, x, y);
      else if (o.type === 'sign') ctx.drawImage(SS, x, y);
      else {
        const dx = p.x - o.x, dy = p.y - o.y;
        const d = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
        drawChar(ctx, x, y - 3, d, 0, NP);
      }
    }
  }));

  // Player Character — Rendered on every frame when outside doorways
  it.push({
    y: p.y,
    f: () => {
      if (entering <= 0.08) {
        drawChar(ctx, Math.round(p.x - 8 - cx), Math.round(p.y - 15 - cy), p.dir, p.fr, PL);
      }
    }
  });

  it.sort((a, b) => a.y - b.y).forEach(i => i.f());
}

let last = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (route() !== 'world' || document.hidden) {
    last = 0; return;
  }
  const dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
  last = t;
  if (entering > 0) {
    entering -= dt; p.y -= 50 * dt;
  } else {
    step(dt);
  }
  near();
  draw(t);
}

/* Initialization */
const start = () => {
  buildSprites();
  show();
  requestAnimationFrame(loop);
  if (route() === 'world') {
    say(["HEY. I'M ABHISHEK. THIS IS MY LITTLE CORNER OF THE INTERNET. GO HAVE A LOOK AROUND."], true);
    setTimeout(() => { if (dintro) closeDlg(); }, 10000);
  }
};

let started = false;
const go1 = () => { if (!started) { started = true; start(); } };
document.fonts ? Promise.race([
  document.fonts.load('8px "Press Start 2P"'),
  new Promise(r => setTimeout(r, 1500))
]).then(go1, go1) : go1();
</script>
</body>
